{% extends "base.html" %}
{% block title %}Add Course - Admin{% endblock %}

{% block content %}
<div class="admin-page-wrapper-padded">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="admin-form-card">
          <h2 class="admin-form-title">➕ Add Course</h2>
          <form method="POST" action="{{ url_for('add_course') }}">
            <div class="admin-form-group">
              <label class="admin-label">Course Name</label>
              <input type="text" name="course_name" required class="admin-input">
            </div>
            <div class="admin-form-group">
              <label class="admin-label">Description</label>
              <textarea name="description" rows="3" required class="admin-textarea"></textarea>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="admin-label">Difficulty</label>
                <select name="difficulty" required class="admin-select">
                  <option value="beginner">Beginner</option>
                  <option value="intermediate">Intermediate</option>
                  <option value="advanced">Advanced</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="admin-label">XP Reward</label>
                <input type="number" name="xp_reward" required class="admin-input">
              </div>
              <div class="col-md-4 mb-3">
                <label class="admin-label">Required XP</label>
                <input type="number" name="required_xp" required class="admin-input">
              </div>
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="btn-admin-save">💾 Add Course</button>
              <a href="{{ url_for('admin_courses') }}" class="btn-admin-cancel">✕ Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
