{% extends "base.html" %}
{% block title %}Quiz - EduQuest{% endblock %}

{% block content %}
<div style="min-height: 100vh; background: linear-gradient(135deg, #0d0d1a 0%, #1a0533 50%, #0d1a2e 100%); padding: 3rem 0; display: flex; align-items: center;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(167,139,250,0.2); border-radius: 1.25rem; padding: 2.5rem; backdrop-filter: blur(10px);">

          <h2 style="color: #ffffff; font-weight: 800; margin-bottom: 0.5rem;">❓ Quiz</h2>
          <p style="color: #64748b; margin-bottom: 2rem; font-size: 0.9rem;">Choose the best answer below</p>

          <form method="POST" class="quiz-form">
            <p style="color: #e2d9f3; font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem;">{{ quiz.question }}</p>

            {% for val, label in [('A', quiz.opt_a), ('B', quiz.opt_b), ('C', quiz.opt_c), ('D', quiz.opt_d)] %}
            <div style="margin-bottom: 0.75rem;">
              <label style="display: flex; align-items: center; gap: 0.85rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(167,139,250,0.15); border-radius: 0.75rem; padding: 0.9rem 1.25rem; cursor: pointer; color: #cbd5e1; transition: all 0.2s;"
                     onmouseover="this.style.background='rgba(124,58,237,0.15)'; this.style.borderColor='rgba(167,139,250,0.5)'"
                     onmouseout="this.style.background='rgba(255,255,255,0.04)'; this.style.borderColor='rgba(167,139,250,0.15)'">
                <input type="radio" name="answer" value="{{ val }}" id="opt_{{ val|lower }}" required style="accent-color: #7c3aed; width: 1.1rem; height: 1.1rem;">
                <span><strong style="color: #a78bfa; margin-right: 0.4rem;">{{ val }})</strong>{{ label }}</span>
              </label>
            </div>
            {% endfor %}

            <div style="display: flex; gap: 0.75rem; margin-top: 1.75rem;">
              <button type="submit"
                      style="flex: 1; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; padding: 0.75rem; border-radius: 0.75rem; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(124,58,237,0.4);">
                ✔ Submit Answer
              </button>
              <a href="{{ url_for('course_detail', course_id=quiz.course_id) }}"
                 style="padding: 0.75rem 1.25rem; border-radius: 0.75rem; border: 1px solid rgba(167,139,250,0.25); color: #94a3b8; text-decoration: none; font-weight: 600; transition: background 0.2s;"
                 onmouseover="this.style.background='rgba(255,255,255,0.06)'"
                 onmouseout="this.style.background='transparent'">
                ✕ Cancel
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
